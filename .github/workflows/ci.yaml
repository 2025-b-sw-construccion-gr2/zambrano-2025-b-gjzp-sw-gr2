name: CI/CD Examen 02

on:
  push:
    branches: [ "main", "feature/migracion-habit-tracker" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # TRABAJO 1: VERIFICAR QUE EL CÓDIGO COMPILA (CI)
  build-java:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Examen02/HabitTracker

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compilar y Verificar (Skip Tests para agilidad)
        run: mvn clean package -DskipTests

  # TRABAJO 2: CONSTRUIR Y SUBIR DOCKER (CD)
  docker-push:
    needs: build-java
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir y Subir Imagen
        uses: docker/build-push-action@v5
        with:
          context: ./Examen02/HabitTracker
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/habit-tracker:latest