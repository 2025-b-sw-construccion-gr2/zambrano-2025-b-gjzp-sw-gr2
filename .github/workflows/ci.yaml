name: CI/CD Examen 02

on:
  push:
    branches: [ "main", "feature/migracion-habit-tracker" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # TRABAJO 1: COMPILAR JAVA
  build-java:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Examen02/HabitTracker

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compilar y Generar WAR
        run: mvn clean package -DskipTests

      - name: Subir Artefacto WAR
        uses: actions/upload-artifact@v4
        with:
          name: app-war
          path: Examen02/HabitTracker/target/*.war

  # TRABAJO 2: CONSTRUIR DOCKER (Solo si Java compila bien)
  docker-push:
    needs: build-java
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Descargar WAR generado
        uses: actions/download-artifact@v4
        with:
          name: app-war
          path: Examen02/HabitTracker/target/

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir y Subir Imagen
        uses: docker/build-push-action@v5
        with:
          context: ./Examen02/HabitTracker
          push: true
          tags: Jhairzp27/habit-tracker:latest